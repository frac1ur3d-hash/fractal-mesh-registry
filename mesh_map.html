<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Aether-Ego: Live Mesh GPS & Topology Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; background: #0a0e17; color: #e2e8f0; }
        #header { height: 60px; background: #0f172a; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid #1e293b; }
        #header h1 { font-size: 18px; color: #38bdf8; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        #header .meta { font-size: 13px; color: #94a3b8; }
        #container { display: flex; height: calc(100vh - 60px); }
        #map { flex: 1; height: 100%; background: #070b12; }
        #sidebar { width: 340px; background: #0f172a; border-left: 1px solid #1e293b; overflow-y: auto; padding: 16px; }
        .node-card { background: #1e293b; border-radius: 8px; padding: 14px; margin-bottom: 12px; border: 1px solid #334155; transition: all 0.2s; cursor: pointer; }
        .node-card:hover { border-color: #38bdf8; transform: translateY(-2px); }
        .node-title { font-weight: bold; color: #f8fafc; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .badge-online { background: #059669; color: #ecfdf5; }
        .badge-root { background: #7c3aed; color: #ede9fe; }
        .node-detail { font-size: 12px; color: #94a3b8; margin-top: 6px; line-height: 1.5; }
        .node-frame { font-family: monospace; font-size: 11px; color: #38bdf8; background: #0a0e17; padding: 6px; border-radius: 4px; margin-top: 8px; word-break: break-all; }
        .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #10b981; margin-right: 6px; box-shadow: 0 0 8px #10b981; }
    </style>
</head>
<body>
    <div id="header">
        <h1><span>⚡</span> AETHER-EGO MESH GPS TELEMETRY</h1>
        <div class="meta">
            <span class="pulse"></span> Live Sync: <span id="sync-status">Connecting...</span> | Nodes: <span id="node-count">0</span>
        </div>
    </div>
    <div id="container">
        <div id="map"></div>
        <div id="sidebar">
            <h3 style="font-size: 13px; color: #64748b; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1px;">Connected Devices</h3>
            <div id="node-list">Loading active nodes...</div>
        </div>
    </div>

    <script>
        const REPO = "frac1ur3d-hash/fractal-mesh-registry";
        const map = L.map('map').setView([45.5234, -122.6762], 12);

        // Dark-mode Mapbox / CartoDB tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        let markers = {};
        let circles = {};

        async function fetchMeshNodes() {
            try {
                document.getElementById('sync-status').textContent = "Updating...";
                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/registry/nodes`);
                if (!res.ok) throw new Error("Registry offline");
                const files = await res.json();
                
                const nodeList = document.getElementById('node-list');
                nodeList.innerHTML = '';
                let bounds = [];
                let activeCount = 0;

                for (let file of files) {
                    if (!file.name.endsWith('.json')) continue;
                    const r = await fetch(file.download_url);
                    const node = await r.json();
                    activeCount++;

                    const loc = node.location || { latitude: 45.5234, longitude: -122.6762, method: "IP_GEOLOCATION", accuracy_meters: 5000 };
                    const lat = parseFloat(loc.latitude);
                    const lon = parseFloat(loc.longitude);
                    const acc = parseFloat(loc.accuracy_meters || 50);

                    bounds.push([lat, lon]);

                    // Add / Update Marker on Map
                    if (!markers[node.node_id]) {
                        const marker = L.circleMarker([lat, lon], {
                            radius: 8,
                            fillColor: node.role === 'root' ? '#8b5cf6' : '#38bdf8',
                            color: '#ffffff',
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.9
                        }).addTo(map);

                        const circle = L.circle([lat, lon], {
                            radius: acc,
                            color: node.role === 'root' ? '#8b5cf6' : '#38bdf8',
                            fillColor: node.role === 'root' ? '#8b5cf6' : '#38bdf8',
                            fillOpacity: 0.15,
                            weight: 1
                        }).addTo(map);

                        marker.bindPopup(`
                            <div style="font-family: monospace; font-size: 12px; color: #0f172a;">
                                <b>${node.node_id}</b> [${node.role.toUpperCase()}]<br>
                                Tailscale IP: ${node.tailscale_ip || 'N/A'}<br>
                                Method: ${loc.method}<br>
                                Accuracy: ~${Math.round(acc)}m<br>
                                Last Seen: ${node.last_seen_iso || 'Just now'}
                            </div>
                        `);

                        markers[node.node_id] = marker;
                        circles[node.node_id] = circle;
                    } else {
                        markers[node.node_id].setLatLng([lat, lon]);
                        circles[node.node_id].setLatLng([lat, lon]);
                        circles[node.node_id].setRadius(acc);
                    }

                    // Render Sidebar Card
                    const card = document.createElement('div');
                    card.className = 'node-card';
                    card.onclick = () => {
                        map.flyTo([lat, lon], 14);
                        markers[node.node_id].openPopup();
                    };
                    card.innerHTML = `
                        <div class="node-title">
                            <span>${node.node_id}</span>
                            <span class="badge ${node.role === 'root' ? 'badge-root' : 'badge-online'}">${node.role}</span>
                        </div>
                        <div class="node-detail">
                            <div>📍 ${loc.city || 'Position'}: ${lat.toFixed(4)}, ${lon.toFixed(4)} (±${Math.round(acc)}m)</div>
                            <div>🌐 Tailnet: ${node.tailscale_ip || '100.x.x.x'}</div>
                            <div>🕒 Last check-in: ${node.last_seen_iso ? node.last_seen_iso.slice(11, 19) + ' UTC' : 'Live'}</div>
                        </div>
                        ${node.dense_frame ? `<div class="node-frame">${node.dense_frame}</div>` : ''}
                    `;
                    nodeList.appendChild(card);
                }

                document.getElementById('node-count').textContent = activeCount;
                document.getElementById('sync-status').textContent = "Active";

                if (bounds.length > 0) {
                    map.fitBounds(bounds, { maxZoom: 14, padding: [40, 40] });
                }
            } catch (err) {
                document.getElementById('sync-status').textContent = "Sync Error: " + err.message;
            }
        }

        fetchMeshNodes();
        setInterval(fetchMeshNodes, 30000); // 30s auto-refresh
    </script>
</body>
</html>
